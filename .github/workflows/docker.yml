name: Docker

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      version:
        required: true
        type: string
    secrets:
      DOCKERHUB_TOKEN:
        required: true

permissions: {}
defaults:
  run:
    shell: bash

jobs:
  docker:
    name: Build and push
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    environment: dockerhub
    env:
      IMAGE: ${{ github.event.repository.full_name }}
      DOCKER_BUILDKIT: 1
      DOCKER_BUILD_SUMMARY: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Determine version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          version=$VERSION
          package_version=$(python -c \
            'import tomllib; from pathlib import Path;
          print(tomllib.loads(Path("crates/zensical/Cargo.toml").read_text())
          ["package"]["version"])')
          if [ "${version#v}" != "$package_version" ]; then
            echo "Release and Cargo.toml versions differ"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Generate tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        env:
          VERSION: ${{ steps.version.outputs.version }}
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,value=${{ env.VERSION }},pattern={{version}}
            type=semver,value=${{ env.VERSION }},pattern={{major}}.{{minor}}
            type=semver,value=${{ env.VERSION }},pattern={{major}}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=Zensical
            org.opencontainers.image.description=A modern static site generator
            org.opencontainers.image.documentation=https://zensical.org/docs/
            org.opencontainers.image.url=https://zensical.org
            org.opencontainers.image.vendor=Zensical
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=MIT

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          pull: true
          no-cache-filters: runtime
          cache-from: |
            type=gha,scope=docker-amd64
            type=gha,scope=docker-arm64
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}

      - name: Check image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          project_dir=$(mktemp -d "$RUNNER_TEMP/zensical-docker.XXXXXX")
          trap 'rm -rf "$project_dir"' EXIT
          docker run --rm --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$project_dir,target=/docs" \
            "$IMAGE:$VERSION" new .
          docker run --rm --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$project_dir,target=/docs" \
            "$IMAGE:$VERSION" build --strict
          # pip strips setuptools to pkg_resources; full copies need VEX review.
          docker run --rm --network none --entrypoint python \
            "$IMAGE:$VERSION" -c 'from pathlib import Path
          from sysconfig import get_path
          assert not any(Path(get_path("purelib")).rglob("setuptools"))'

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.2

      - name: Scan image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          trivy image --scanners vuln --exit-code 1 \
            --vex .github/docker.vex.json --show-suppressed "$IMAGE:$VERSION"

      - name: Sign in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: zensical
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          pull: true
          no-cache-filters: runtime
          cache-from: |
            type=gha,scope=docker-amd64
            type=gha,scope=docker-arm64
          platforms: |
            linux/amd64
            linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Inspect manifest
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools inspect "$IMAGE:$VERSION"

      - name: Inspect image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker pull "$IMAGE:$VERSION"
          docker image inspect "$IMAGE:$VERSION"

      - name: Scan published images
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          for arch in amd64 arm64; do
            trivy image --image-src remote --platform "linux/$arch" \
              --scanners vuln --exit-code 1 \
              --vex .github/docker.vex.json --show-suppressed "$IMAGE:$VERSION"
          done
