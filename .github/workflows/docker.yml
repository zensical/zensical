name: Docker

on:
  pull_request:
    types:
      - closed
    branches:
      - master

jobs:
  docker:
    name: Build and push
    if: |
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    permissions:
      contents: read
    timeout-minutes: 120
    runs-on: ubuntu-latest
    environment: dockerhub
    env:
      IMAGE: ${{ github.event.repository.full_name }}
      DOCKER_BUILDKIT: 1
      DOCKER_BUILD_SUMMARY: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Determine version
        id: version
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          VERSION=${RELEASE_BRANCH#release/}
          PACKAGE_VERSION=$(python -c 'import tomllib; print(tomllib.load(open("crates/zensical/Cargo.toml", "rb"))["package"]["version"])')
          if [ "${VERSION#v}" != "$PACKAGE_VERSION" ]; then
            echo "Release branch and Cargo.toml versions differ"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Generate tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        env:
          VERSION: ${{ steps.version.outputs.version }}
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,value=${{ env.VERSION }},pattern={{version}}
            type=semver,value=${{ env.VERSION }},pattern={{major}}.{{minor}}
            type=semver,value=${{ env.VERSION }},pattern={{major}}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=Zensical
            org.opencontainers.image.description=A modern static site generator
            org.opencontainers.image.documentation=https://zensical.org/docs/
            org.opencontainers.image.url=https://zensical.org
            org.opencontainers.image.vendor=Zensical
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=MIT

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}

      - name: Check image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          PROJECT_DIR=$(mktemp -d "$RUNNER_TEMP/zensical-docker.XXXXXX")
          trap 'rm -rf "$PROJECT_DIR"' EXIT
          docker run --rm --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PROJECT_DIR,target=/docs" \
            "$IMAGE:$VERSION" new .
          docker run --rm --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PROJECT_DIR,target=/docs" \
            "$IMAGE:$VERSION" build --strict

      - name: Sign in to DockerHub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: zensical
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: |
            linux/amd64
            linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Inspect manifest
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools inspect "$IMAGE:$VERSION"

      - name: Inspect image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker pull "$IMAGE:$VERSION"
          docker image inspect "$IMAGE:$VERSION"
