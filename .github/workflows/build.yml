name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      attestations:
        required: true
        type: boolean

permissions:
  attestations: write # Required for attestations
  id-token: write # Required for OIDC

jobs:
  linux:
    name: Wheel (Linux, ${{ matrix.platform.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - name: x64
            target: x86_64-unknown-linux-gnu
          - name: arm64
            target: aarch64-unknown-linux-gnu
          - name: armv7
            target: armv7-unknown-linux-gnueabihf

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.x

      - name: Prepare build
        run: python scripts/prepare.py

      - name: Build artifact
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: auto
          # Temporary fix for https://github.com/zensical/zensical/issues/425
          args: >-
            --release --out artifacts
            --interpreter python3.10
          # args: --release --out artifacts
          sccache: >
            ${{ !startsWith(github.event.pull_request.head.ref, 'release/') }}

      - name: Create artifact attestation
        if: inputs.attestations == true
        uses: actions/attest@v4
        with:
          show-summary: false
          subject-path: artifacts/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wheel-linux-${{ matrix.platform.name }}
          path: artifacts/*

  musllinux:
    name: Wheel (Linux, musl, ${{ matrix.platform.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - name: x64
            target: x86_64-unknown-linux-musl
          - name: arm64
            target: aarch64-unknown-linux-musl

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.x

      - name: Prepare build
        run: python scripts/prepare.py

      - name: Build artifact
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: musllinux_1_2
          args: --release --out artifacts
          sccache: >
            ${{ !startsWith(github.event.pull_request.head.ref, 'release/') }}

      - name: Create artifact attestation
        if: inputs.attestations == true
        uses: actions/attest@v4
        with:
          show-summary: false
          subject-path: artifacts/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wheel-musllinux-${{ matrix.platform.name }}
          path: artifacts/*

  windows:
    name: Wheel (Windows, ${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      matrix:
        platform:
          - name: x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
          - name: arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.x
          architecture: ${{ matrix.platform.name }}

      - name: Prepare build
        run: python scripts/prepare.py

      - name: Build artifact
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out artifacts
          sccache: >
            ${{ !startsWith(github.event.pull_request.head.ref, 'release/') }}

      - name: Create artifact attestation
        if: inputs.attestations == true
        uses: actions/attest@v4
        with:
          show-summary: false
          subject-path: artifacts/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wheel-windows-${{ matrix.platform.name }}
          path: artifacts/*

  macos:
    name: Wheel (macOS, ${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      matrix:
        platform:
          - name: x64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - name: arm64
            os: macos-15
            target: aarch64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.x

      - name: Prepare build
        run: python scripts/prepare.py

      - name: Build artifact
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out artifacts
          sccache: >
            ${{ !startsWith(github.event.pull_request.head.ref, 'release/') }}

      - name: Create artifact attestation
        if: inputs.attestations == true
        uses: actions/attest@v4
        with:
          show-summary: false
          subject-path: artifacts/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wheel-macos-${{ matrix.platform.name }}
          path: artifacts/*

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.x

      - name: Prepare build
        run: python scripts/prepare.py

      - name: Build artifact
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out artifacts

      - name: Create artifact attestation
        if: inputs.attestations == true
        uses: actions/attest@v4
        with:
          show-summary: false
          subject-path: artifacts/*

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheel-sdist
          path: artifacts/*

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ github.event.repository.full_name }}
      DOCKER_BUILDKIT: 1
      DOCKER_BUILD_SUMMARY: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-flags: --debug

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
