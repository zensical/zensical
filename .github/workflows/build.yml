name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      attestations:
        required: true
        type: boolean

permissions: {}
defaults:
  run:
    shell: bash

env:
  SCCACHE_GHA_RW_MODE: >-
    ${{ github.event_name == 'push' &&
        github.ref == 'refs/heads/master' && 'READ_WRITE' || 'READ_ONLY' }}

concurrency:
  group: >-
    ${{ github.workflow }}-build-${{
        github.event_name == 'pull_request' &&
        github.event.action != 'closed' &&
        github.event.pull_request.number || github.run_id }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' &&
        github.event.action != 'closed' }}

jobs:
  linux:
    name: Wheel (Linux, ${{ matrix.platform.name }})
    permissions:
      contents: read
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        platform:
          - name: x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.x

      - name: Build artifact
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          rust-toolchain: 1.99.1
          target: ${{ matrix.platform.target }}
          manylinux: auto
          # Temporary fix for https://github.com/zensical/zensical/issues/425
          args: >-
            --locked --release --out artifacts
            --interpreter python3.11
          # args: --locked --release --out artifacts
          sccache: true

      - name: Check package contents
        run: python scripts/check-package.py artifacts

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wheel-linux-${{ matrix.platform.name }}
          path: artifacts/*
          if-no-files-found: error

  musllinux:
    name: Wheel (Linux, musl, ${{ matrix.platform.name }})
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      matrix:
        platform:
          - name: x64
            target: x86_64-unknown-linux-musl
          - name: arm64
            target: aarch64-unknown-linux-musl

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.x

      - name: Build artifact
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          rust-toolchain: 1.99.1
          target: ${{ matrix.platform.target }}
          manylinux: musllinux_1_2
          args: --locked --release --out artifacts
          sccache: true

      - name: Check package contents
        run: python scripts/check-package.py artifacts

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wheel-musllinux-${{ matrix.platform.name }}
          path: artifacts/*
          if-no-files-found: error

  windows:
    name: Wheel (Windows, ${{ matrix.platform.name }})
    permissions:
      contents: read
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        platform:
          - name: x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
          - name: arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.x
          architecture: ${{ matrix.platform.name }}

      - name: Build artifact
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          rust-toolchain: 1.99.1
          target: ${{ matrix.platform.target }}
          args: --locked --release --out artifacts
          sccache: true

      - name: Check package contents
        run: python scripts/check-package.py artifacts

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wheel-windows-${{ matrix.platform.name }}
          path: artifacts/*
          if-no-files-found: error

  macos:
    name: Wheel (macOS, ${{ matrix.platform.name }})
    permissions:
      contents: read
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        platform:
          - name: x64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - name: arm64
            os: macos-15
            target: aarch64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.x

      - name: Build artifact
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          rust-toolchain: 1.99.1
          target: ${{ matrix.platform.target }}
          args: --locked --release --out artifacts
          sccache: true

      - name: Check package contents
        run: python scripts/check-package.py artifacts

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wheel-macos-${{ matrix.platform.name }}
          path: artifacts/*
          if-no-files-found: error

  sdist:
    name: Source distribution
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.x

      - name: Build artifact
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          args: --out artifacts

      - name: Check package contents
        run: python scripts/check-package.py artifacts

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wheel-sdist
          path: artifacts/*
          if-no-files-found: error

  docker:
    name: Docker image
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      IMAGE: ${{ github.event.repository.full_name }}
      DOCKER_BUILDKIT: 1
      DOCKER_BUILD_SUMMARY: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=docker
          cache-to: >-
            ${{ github.event_name == 'push' &&
                github.ref == 'refs/heads/master' &&
                'type=gha,scope=docker,mode=max,ignore-error=true' || '' }}

      - name: Check image
        run: |
          project_dir=$(mktemp -d "$RUNNER_TEMP/zensical-docker.XXXXXX")
          trap 'rm -rf "$project_dir"' EXIT
          docker run --rm --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$project_dir,target=/docs" \
            "$IMAGE:latest" new .
          docker run --rm --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$project_dir,target=/docs" \
            "$IMAGE:latest" build --strict

  release:
    name: Release
    if: |
      always() &&
      github.event.action != 'closed' &&
      startsWith(github.head_ref, 'release/')
    needs:
      - linux
      - musllinux
      - windows
      - macos
      - sdist
      - docker
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Check required jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: >-
          jq -e 'length > 0 and all(.[]; .result == "success")'
          <<< "$RESULTS"

  attestations:
    name: Attestations
    if: inputs.attestations == true
    needs:
      - linux
      - musllinux
      - windows
      - macos
      - sdist
    permissions:
      contents: read
      attestations: write
      id-token: write
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: wheel-*
          path: artifacts
          merge-multiple: true

      - name: Create artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          show-summary: false
          subject-path: artifacts/*
