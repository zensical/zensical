name: Release

on:
  pull_request:
    types:
      - closed
    branches:
      - master

permissions: {}
defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check
    if: |
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    permissions:
      contents: read
    uses: ./.github/workflows/check.yml # zizmor: ignore[self-repository]
    with:
      ref: ${{ github.event.pull_request.merge_commit_sha }}

  build:
    name: Build
    if: |
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    permissions:
      contents: read
      attestations: write
      id-token: write
    uses: ./.github/workflows/build.yml # zizmor: ignore[self-repository]
    with:
      ref: ${{ github.event.pull_request.merge_commit_sha }}
      attestations: true

  tag:
    name: Create tag
    needs:
      - check
      - build
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Determine version
        id: version
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          version=${RELEASE_BRANCH#release/}
          package_version=$(python -c \
            'import tomllib; from pathlib import Path;
          print(tomllib.loads(Path("crates/zensical/Cargo.toml").read_text())
          ["package"]["version"])')
          if [ "${version#v}" != "$package_version" ]; then
            echo "Release branch and Cargo.toml versions differ"
            exit 1
          fi
          git check-ref-format "refs/tags/$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git show-ref --verify --quiet "refs/tags/$VERSION"; then
            test "$(git rev-parse "$VERSION^{commit}")" = \
              "$(git rev-parse 'HEAD^{commit}')"
          else
            git tag -a -m "Release $VERSION" -- "$VERSION"
          fi
          git push origin "refs/tags/$VERSION"

  release:
    name: Create release
    needs: tag
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Set up mono
        uses: zensical/mono@c6ece01fa0d0b2f46300e5998b1f07a5b77be616

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: wheel-*
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          error="$RUNNER_TEMP/release-error.txt"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION" \
            > /dev/null 2> "$error"; then
            echo "Release $VERSION already exists"
          elif grep -q 'HTTP 404' "$error"; then
            mono version changelog -s "$VERSION" > notes.txt
            gh release create "$VERSION" \
              --verify-tag \
              --title "${VERSION#v}" \
              --notes-file notes.txt \
              --draft
          else
            cat "$error" >&2
            exit 1
          fi

      - name: Upload release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(artifacts/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release artifacts found" >&2
            exit 1
          fi
          assets=$(gh release view "$VERSION" --json assets \
            --jq '.assets[].name')
          draft=$(gh release view "$VERSION" --json isDraft \
            --jq '.isDraft')
          mkdir -p "$RUNNER_TEMP/release-assets"
          for file in "${files[@]}"; do
            name=$(basename "$file")
            if grep -Fxq -- "$name" <<< "$assets"; then
              gh release download "$VERSION" --pattern "$name" \
                --dir "$RUNNER_TEMP/release-assets" --clobber
              if ! cmp -s "$file" "$RUNNER_TEMP/release-assets/$name"; then
                echo "Existing asset $name differs from the build" >&2
                exit 1
              fi
            elif [ "$draft" = true ]; then
              gh release upload "$VERSION" "$file"
            else
              echo "Published release is missing asset $name" >&2
              exit 1
            fi
          done

  publish:
    name: Publish
    needs:
      - tag
      - release
    permissions:
      id-token: write
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    environment:
      name: pypi
      url: https://pypi.org/p/zensical
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: wheel-*
          path: artifacts
          merge-multiple: true

      - name: Publish to pypi.org
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: artifacts
          attestations: true
          skip-existing: true

  publish-release:
    name: Publish release
    needs:
      - tag
      - publish
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - name: Publish release
        run: gh release edit "$VERSION" --draft=false
